<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch A2 Tutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 12px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* --- FÜLEK STÍLUSA --- */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* --- KÁRTYÁK ÉS KERESŐ --- */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.btn-primary {
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .word-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .badge {
            background-color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .translation {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        .detail-text {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        ul.examples {
            list-style: none;
            padding: 0;
            margin-top: 6px;
        }

        ul.examples li {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            border-left: 3px solid var(--accent-color);
        }

        .btn-save {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background-color: var(--success-color);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .history-section h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .history-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            display: none;
        }

        /* --- FLASHCARD GYAKORLÓ STÍLUSOK --- */
        .flashcard-box {
            text-align: center;
            padding: 30px 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .flashcard-box:active {
            transform: scale(0.98);
        }

        .flashcard-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 16px;
        }

        .practice-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-secondary {
            flex: 1;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Deutsch A2 Tutor</h1>
        <p>AI Szótár és Nyelvtani Segéd</p>
    </header>

    <!-- FŐ FÜLEK -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('szotarTab', this)">📘 Szótár & Kereső</button>
        <button class="tab-btn" onclick="switchTab('gyakorloTab', this)">🏋️ Napi Gyakorló</button>
    </div>

    <!-- ================= 1. SZÓTÁR & KERESŐ FÜL ================= -->
    <div id="szotarTab" class="tab-content active">
        <div class="search-box">
            <input type="text" id="queryInput" placeholder="Német szó vagy mondat..." onkeypress="handleKeyPress(event)">
            <button class="btn-primary" onclick="analyzeWord()">Elemzés</button>
        </div>

        <div id="loading" class="loading">Gemini AI elemzés folyamatban...</div>

        <div id="resultCard" class="card" style="display: none;">
            <div class="card-header">
                <span class="word-title" id="resWord"></span>
                <span class="badge" id="resType"></span>
            </div>
            <div class="translation" id="resTranslation"></div>
            
            <div id="conjugationContainer">
                <div class="section-title">Nyelvtani alaktani megjegyzés</div>
                <div class="detail-text" id="resConjugation"></div>
            </div>

            <div class="section-title">Példamondatok (A2)</div>
            <ul class="examples" id="resExamples"></ul>

            <div class="section-title">Magyarázat</div>
            <div class="detail-text" id="resExplanation"></div>

            <button class="btn-save" onclick="saveCurrentWord()">Mentés a szótáramba</button>
        </div>

        <div class="history-section">
            <h2>Mentett szavaim</h2>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- ================= 2. NAPI GYAKORLÓ FÜL ================= -->
    <div id="gyakorloTab" class="tab-content">
        <div id="practiceContainer" class="card flashcard-box" onclick="flipCard()">
            <div id="cardFront">
                <div class="word-title" id="practiceWord" style="font-size: 1.8rem;">—</div>
                <div class="flashcard-hint">Kattints ide a fordítás felfedéséhez! 🔄</div>
            </div>
            <div id="cardBack" style="display: none;">
                <div class="translation" id="practiceTranslation" style="font-size: 1.5rem; margin-bottom: 8px;">—</div>
                <div class="detail-text" id="practiceExplanation" style="font-size: 0.9rem; color: var(--text-muted);">—</div>
            </div>
        </div>

        <div class="practice-controls">
            <button class="btn-secondary" onclick="flipCard()">🔄 Megfordítás</button>
            <button class="btn-primary" style="flex: 1;" onclick="nextPracticeWord()">Következő szó ➡️</button>
        </div>
    </div>

    <script>
        let currentAnalysis = null;
        let savedWords = [];
        let currentPracticeIndex = 0;
        let isCardFlipped = false;

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');

            if (tabId === 'gyakorloTab') {
                startPractice();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') analyzeWord();
        }

        async function analyzeWord() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || "Hiba a lekérés során");
                }

                currentAnalysis = data;
                renderResult(currentAnalysis);
            } catch (err) {
                alert("Hiba történt: " + err.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderResult(data) {
            const wordDisplay = data.article ? `${data.article} ${data.german_word} ${data.plural ? '(' + data.plural + ')' : ''}` : data.german_word;
            document.getElementById('resWord').innerText = wordDisplay;
            document.getElementById('resType').innerText = data.word_type;
            document.getElementById('resTranslation').innerText = data.hungarian_translation;
            document.getElementById('resConjugation').innerText = data.conjugation_notes || '—';
            document.getElementById('resExplanation').innerText = data.grammar_explanation || '—';

            const examplesList = document.getElementById('resExamples');
            examplesList.innerHTML = '';
            data.example_sentences.forEach(ex => {
                const li = document.createElement('li');
                li.innerText = ex;
                examplesList.appendChild(li);
            });

            document.getElementById('resultCard').style.display = 'block';
        }

        async function saveCurrentWord() {
            if (!currentAnalysis) return;

            try {
                const res = await fetch('/api/words/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentAnalysis)
                });
                if (res.ok) {
                    alert("Sikeresen elmentve!");
                    loadHistory();
                }
            } catch (err) {
                alert("Mentési hiba!");
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/words');
                savedWords = await res.json();
                const container = document.getElementById('historyList');
                container.innerHTML = '';

                if (savedWords.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 12px;">Még nincs mentett szavad. Elemzés után ments el párat!</div>';
                    return;
                }

                savedWords.forEach(w => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    const title = w.article ? `${w.article} ${w.german_word}` : w.german_word;
                    item.innerHTML = `
                        <div>
                            <strong>${title}</strong>
                            <div style="font-size:0.85rem; color: var(--text-muted);">${w.hungarian_translation}</div>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error("Szótár betöltési hiba", err);
            }
        }

        /* --- GYAKORLÓ LOGIKA --- */
        function startPractice() {
            if (savedWords.length === 0) {
                document.getElementById('practiceWord').innerText = "Nincs mentett szó!";
                document.getElementById('practiceTranslation').innerText = "Először ments el szavakat a szótár fülön.";
                document.getElementById('cardFront').style.display = 'block';
                document.getElementById('cardBack').style.display = 'none';
                return;
            }
            currentPracticeIndex = 0;
            showPracticeCard();
        }

        function showPracticeCard() {
            if (savedWords.length === 0) return;
            const wordObj = savedWords[currentPracticeIndex];
            const displayTitle = wordObj.article ? `${wordObj.article} ${wordObj.german_word}` : wordObj.german_word;
            
            document.getElementById('practiceWord').innerText = displayTitle;
            document.getElementById('practiceTranslation').innerText = wordObj.hungarian_translation;
            document.getElementById('practiceExplanation').innerText = wordObj.grammar_explanation || '—';

            // Alaphelyzet: előlap látszik
            isCardFlipped = false;
            document.getElementById('cardFront').style.display = 'block';
            document.getElementById('cardBack').style.display = 'none';
        }

        function flipCard() {
            if (savedWords.length === 0) return;
            isCardFlipped = !isCardFlipped;
            if (isCardFlipped) {
                document.getElementById('cardFront').style.display = 'none';
                document.getElementById('cardBack').style.display = 'block';
            } else {
                document.getElementById('cardFront').style.display = 'block';
                document.getElementById('cardBack').style.display = 'none';
            }
        }

        function nextPracticeWord() {
            if (savedWords.length === 0) return;
            // Véletlenszerű kártyaválasztás a mentett szavak közül
            currentPracticeIndex = Math.floor(Math.random() * savedWords.length);
            showPracticeCard();
        }

        loadHistory();
    </script>
</body>
</html>
